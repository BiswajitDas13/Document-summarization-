<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Document Summarizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="text-center mb-4">📄 Google Drive Document Summaries</h2>

    <div class="d-flex justify-content-end mb-3 gap-2">
      <a href="/refresh" class="btn btn-primary">Refresh</a>
      <a href="/download" class="btn btn-success">Download CSV</a>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <table class="table table-bordered table-striped shadow">
      <thead class="table-dark">
        <tr>
          <th style="width: 25%;">File Name</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody>
        {% for row in results %}
          <tr>
            <td>{{ row.file_name }}</td>
            <td style="white-space: pre-wrap;">{{ row.summary }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
